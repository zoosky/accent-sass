[workspace]
# Edition 2024 members imply resolver 3; a virtual workspace does not inherit
# it, so cargo warns and silently keeps resolver 1 unless it is stated here.
resolver = "3"
members = [
    "crates/compiler",
    "crates/accent-sass-macro",
    "crates/lib",
]

[profile.release]
debug = 1
panic = "abort"
lto = true
codegen-units = 1

[profile.small]
inherits = 'release'
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

