# The accent-sass project website, built with Accent CMS.
#
# The dogfooding here is not decorative. Accent compiles this theme's
# `main.scss` with accent-sass, so the stylesheet you are reading the site
# through was produced by the compiler the site documents, and `/demo`
# compiles Bulma and USWDS in the reader's browser with the same engine built
# to WebAssembly.
#
# Nothing here is read by `cargo`. The site is built by
# `.github/workflows/pages.yml`, which never touches the crate.

server:
  address: "127.0.0.1"
  # Not 4400 (the Accent starter), 4440 (the Accent docs site) or 4450
  # (accent-proust): those are sibling sites that may be running at the same
  # time, and a collision surfaces as a confusing "address in use".
  port: 4460

content:
  directory: "./content"
  # Off: Accent otherwise emits a `<page>.md/index.html` meta-refresh stub
  # beside every page, so a GitHub-style `.md` link bounces to the clean URL.
  # Nothing links to this site that way -- its pages are reached through its
  # own navigation -- and the stubs surfaced as ten extra routes carrying no
  # head metadata. They are excluded from `sitemap.xml` and `feed.xml` either
  # way, so this changes what the build emits rather than what is indexed.
  # The cost is the redirect itself: `/guide.md` now 404s instead of bouncing
  # to `/guide`.
  md_extension_redirects: false

theme:
  name: "sass"
  directory: "./themes"

site:
  name: "accent-sass"
  # The GitHub Pages project URL. Its path component tells `accent build` to
  # prefix every internal link with `/accent-sass`, and its origin is what
  # makes the sitemap's `<loc>` entries and robots.txt's `Sitemap:` line
  # absolute, as both specifications require.
  #
  # `pages.yml` passes this same URL to `--base-url`, which Accent's
  # documentation asks for on a production build rather than leaving it to
  # this fallback, so the two have to agree -- a repository rename is a change
  # in both places. The workflow once passed a step output that no step
  # produced, which sent an empty string and shipped a sitemap of relative
  # URLs: an empty value is worse than no flag, because it replaces this
  # value instead of deferring to it.
  url: https://zoosky.github.io/accent-sass
  description: >-
    A Sass compiler written in Rust, at parity with dart-sass. Compiles Bulma,
    Pico, Foundation and USWDS, and runs in a browser through WebAssembly.
  language: en-US
  meta:
    og:locale: "en_US"
    # Google Search Console ownership, by the HTML-tag method. Google reads the
    # token from the site root, so it has to be in every build rather than
    # pasted in once; deleting this line un-verifies the property. It lives here
    # rather than in a template because `head_meta.html.jinja` renders this map
    # into the head of every page, and a key with no `og:` or `twitter:` prefix
    # becomes `name=`, which is the form Google looks for.
    google-site-verification: "yS18C91qoSaQvcIS0JI33YvZ-KKx_kDXfJarTH7dqGw"

build:
  # Off deliberately, for the same reason accent-proust turns it off:
  # fingerprinting rewrites asset URLs to content-hashed names, and the
  # demo's WebAssembly glue resolves `index_bg.wasm` relative to its own URL
  # at runtime -- a name no build can rewrite, because it lives inside a
  # generated JavaScript string rather than in an href a template renders.
  # Pages sends its own `Cache-Control` and this site is small.
  fingerprint:
    enabled: false
  routing:
    error_document: /404.html

markdown:
  tables: true
  footnotes: true
  strikethrough: true
  tasklists: true
  heading_attributes: true
  # Off: these pages quote CLI flags, Sass operators and code all the way
  # through, and smart quotes would rewrite them into something that does not
  # run.
  smart_punctuation: false
  gfm: true
  definition_lists: true
  metadata_blocks: true

code:
  theme: "base16-ocean.dark"

search:
  backend: simple
  # The default is 200 characters, which indexes roughly the first paragraph
  # and leaves the rest of a reference page unfindable -- `loadPaths`,
  # `MemoryFs`, `--load-path` and every other term worth searching for lives
  # further down. These pages are a few thousand words at most.
  content_length: 50000
  exclude:
    - "/404"
    - "/tags/*"

llms:
  enabled: true
  description: |
    accent-sass is a Sass compiler written in Rust, at parity with dart-sass
    1.104.0. It is a fork of connorskees/grass that carries the modern Dart
    Sass features upstream has not released. It runs as a library, as a
    command-line binary, and in a browser through WebAssembly. These pages
    cover installation, the command line, the Rust API, the browser API, and
    what the compiler is and is not compatible with.
  extra_links:
    - title: "Source"
      url: "https://github.com/zoosky/accent-sass"
    - title: "API documentation (docs.rs)"
      url: "https://docs.rs/accent-sass"
    - title: "crates.io"
      url: "https://crates.io/crates/accent-sass"

diagrams:
  render_mode: server
  renderers:
    mermaid:
      theme: dark

dev:
  hot_reload: true
  browser_reload: true
  debounce_ms: 50
