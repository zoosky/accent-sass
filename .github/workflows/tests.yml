name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - name: version info
        run: rustc --version; cargo --version;

      - name: Run all tests
        run: cargo test --features=macro

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - run: |
          rustup component add clippy
          cargo clippy --features=macro -- -D warnings

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        run: cargo build

      - name: Install dart-sass 1.54.3
        run: |
          wget https://github.com/sass/dart-sass/releases/download/1.54.3/dart-sass-1.54.3-linux-x64.tar.gz
          tar -xzvf dart-sass-1.54.3-linux-x64.tar.gz

      - name: Install bootstrap
        run: git clone --depth=1 --branch v5.0.2 https://github.com/twbs/bootstrap.git

      - name: Verify unchanged output
        run: |
          ./target/debug/grass bootstrap/scss/bootstrap.scss > grass-output.css
          ./dart-sass/sass bootstrap/scss/bootstrap.scss > dart-sass-output.css

          if [[ $(diff -u grass-output.css dart-sass-output.css) ]]; then
              echo "Differences found"
              diff -u grass-output.css dart-sass-output.css
              exit 1
          else
              echo "No differences found"
          fi

  # Conformance against the official Sass spec suite (the `sass-spec`
  # submodule). Advisory only -- `continue-on-error` keeps it from gating a
  # merge, because most failures are the CSS Color 4 colour spaces this fork
  # does not implement. See the results table in README.md. Runs on the
  # self-hosted runner.
  sass-spec:
    continue-on-error: true
    runs-on: [self-hosted, linux, x64, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: version info
        run: rustc --version; cargo --version; node --version

      - name: Build binary
        run: cargo build --release

      - name: Install spec runner
        working-directory: sass-spec
        run: npm install --no-audit --no-fund

      - name: Run Sass spec
        working-directory: sass-spec
        run: |
          # The runner exits non-zero whenever any test fails, which is
          # expected here; the tallies are the output we want.
          npm run sass-spec -- \
            --impl=dart-sass \
            --command '../target/release/grass' \
            --trim-errors --ignore-warning-diffs --ignore-error-diffs \
            > spec-results.txt 2>&1 || true
          tail -n 40 spec-results.txt

      - name: Publish tallies
        working-directory: sass-spec
        run: |
          {
            echo "### Sass spec conformance"
            echo
            echo '```'
            grep -a 'runs,' spec-results.txt | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
