[package]
name = "accent-sass-macro"
version = "0.16.0"
edition = "2024"
description = "Internal implementation of the accent_sass::include! macro"
readme = "README.md"
license = "MIT"
categories = ["web-programming"]
keywords = ["scss", "sass", "css", "web"]
repository = "https://github.com/zoosky/accent-sass"
authors = [
    "Connor Skees <39542938+ConnorSkees@users.noreply.github.com>",
    "Zoo Sky <127824+zoosky@users.noreply.github.com>",
]
include = ["src", "Cargo.toml", "README.md", "LICENSE"]
rust-version = "1.96.1"

[lib]
proc-macro = true

[dependencies]
# `parse_macro_input!` is gated on `parsing` + `proc-macro`, and
# `Error::into_compile_error` on `printing`. With syn 2 this crate compiled
# without naming them, because another crate in the graph enabled syn's
# defaults and feature unification handed them over. syn 3 resolves as its own
# package with no such enabler, so the features this crate uses are declared
# here rather than borrowed.
syn = { version = "3", default-features = false, features = [
    "parsing",
    "printing",
    "proc-macro",
] }
accent_sass_compiler = { path = "../compiler", version = "=0.16.0" }
quote = { version = "1.0.23", default-features = false }

[features]
nightly = []
