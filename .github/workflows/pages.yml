name: 'Demo site'

# Builds the browser demo in `docs/demo` and publishes it to GitHub Pages.
#
# The demo's two large inputs -- the wasm module and the framework Sass
# bundles -- are built here rather than committed. Together they are about
# 2.8 MB, and the module changes with every compiler change, so committing
# them would add a new copy of a binary to the history on each release.
# `docs/demo/vendor` is ignored for that reason.
#
# This publishes through the Pages *action* rather than the "deploy from a
# branch" setting, because that setting can only serve files that are in the
# tree. Set Settings -> Pages -> Source to "GitHub Actions" for this to take
# effect.

on:
  push:
    branches:
      - master
    paths:
      - 'crates/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
      - '.github/scripts/demo-bundle.mjs'

  # The demo is worth checking on a pull request that can break it, even
  # though only `master` publishes.
  pull_request:
    paths:
      - 'crates/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
      - '.github/scripts/demo-bundle.mjs'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  # The Accent CMS release the site is built with. Pinned rather than "latest"
  # for the reason accent-proust pins it: a template that renders differently
  # after a CMS release should be a change someone made, not a deployment
  # nobody triggered. This is the newest stable release -- v0.26.0 is at rc.2 --
  # and the site was verified to build with it.
  ACCENT_VERSION: v0.25.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # `curl ... | sh` reports the exit status of `sh`, not of `curl`, and
      # `sh` fed an empty script exits 0. So a failed download installed
      # nothing, this step went green, and the build died two steps later with
      # `wasm-pack: command not found`, which names the wrong cause. That
      # happened on master on 2026-09-12, from `curl: (35) Recv failure:
      # Connection reset by peer`, and cost a deploy. `pipefail` makes the
      # download's failure this step's failure; the version check proves
      # something was actually installed.
      - name: 'Install wasm-pack'
        run: |
          set -o pipefail
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      # `wasm-exports` is what defines the bindings, and it is not a default
      # feature: without it wasm-bindgen exports nothing and the page loads a
      # module with no compiler in it. `commandline` is dropped because clap
      # has no place in a browser build; `random` is kept, because dropping it
      # would quietly remove `math.random()` and `unique-id()`.
      - name: 'Build the wasm package'
        run: |
          wasm-pack build crates/lib --release --target web --out-name index \
            --out-dir ../../docs/demo/vendor/pkg -- \
            --no-default-features --features wasm-exports,random

      # Run the package before shipping it. The demo is the one place a broken
      # binding would be invisible until a user opened the page.
      - name: 'Check the package works'
        run: |
          node .github/scripts/wasm-smoke.mjs docs/demo/vendor/pkg
          node .github/scripts/wasm-api-smoke.mjs docs/demo/vendor/pkg

      - name: 'Build the framework bundles'
        run: node .github/scripts/demo-bundle.mjs

      # The bundle layout, the entry stylesheet and the JavaScript API are each
      # checked above or in `cargo test`; nothing else checks that the three
      # agree. A mismatch between them shows up only as a blank published page,
      # so compile both frameworks the way the page compiles them.
      - name: 'Compile the frameworks the page ships'
        run: node .github/scripts/demo-check.mjs

      # The documentation site, which is what Pages actually serves. Accent
      # compiles the theme's Sass with accent-sass, so a stylesheet the
      # compiler cannot build fails the deploy rather than shipping unstyled.
      - name: 'Install Accent CMS'
        run: |
          # The asset name embeds the version, so it is derived from the tag
          # rather than written twice.
          curl -sSL -o accent.tar.gz \
            "https://github.com/AccentCMS/accent/releases/download/${ACCENT_VERSION}/accent-${ACCENT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xf accent.tar.gz
          sudo install -m 755 accent /usr/local/bin/accent
          accent --version

      # The production URL is written out. Accent's static-build documentation
      # is direct about it -- "always set it to your production domain" --
      # because the base URL is what makes the sitemap's `<loc>` entries, the
      # feed, the canonical links and robots.txt's `Sitemap:` line absolute.
      #
      # This flag used to read `${{ steps.pages.outputs.base_url }}`, and no
      # step declares `id: pages` -- `actions/configure-pages` is not used in
      # this workflow -- so it expanded to the empty string on every build.
      # That is worse than omitting the flag, because an empty value replaces
      # the `site.url` fallback rather than deferring to it: the site shipped
      # `<loc>/accent-sass/</loc>` and `Sitemap: /accent-sass/sitemap.xml`,
      # which both specifications forbid and which Search Console rejects.
      #
      # The path component also derives the `/accent-sass` prefix that every
      # internal link carries, so this URL and `site.url` in the config have
      # to agree; the config says the same thing on its side.
      - name: 'Build the site'
        run: |
          accent build \
            --config docs/config.yaml \
            --output docs/output \
            --base-url https://zoosky.github.io/accent-sass \
            --clean

      # The demo page itself is rendered by the build above, from
      # `content/demo/default.md` and the theme's `demo` template, so it carries
      # the site's header and footer. What is copied here is what that page
      # loads and Accent does not build: its scripts, its stylesheet, and the
      # 2.8 MB of generated wasm and framework JSON in `vendor/`, which is
      # deliberately not committed. Placing them in `media/` would move them to
      # `/media/demo`, away from the page.
      - name: 'Stage the demo assets beside the page'
        run: |
          grep -q 'class="site-header"' docs/output/demo/index.html
          grep -q 'id="source"' docs/output/demo/index.html
          cp docs/demo/app.js docs/demo/worker.js docs/demo/styles.css docs/output/demo/
          cp -R docs/demo/vendor docs/output/demo/vendor
          test -f docs/output/demo/vendor/pkg/index_bg.wasm
          test -f docs/output/demo/vendor/frameworks/manifest.json

      # CHANGELOG.md is mounted as a page by `content.mounts` in config.yaml.
      # A mount whose source moved would drop the page without failing the
      # build, so check that it rendered and carries the file's content.
      - name: 'Check the changelog page'
        run: grep -q 'Keep a Changelog' docs/output/changelog/index.html

      - name: 'Report what the site carries'
        run: |
          {
            echo "### Demo site payload"
            echo
            echo "| file | bytes | gzipped |"
            echo "|---|---:|---:|"
            for f in docs/demo/vendor/pkg/index_bg.wasm \
                     docs/demo/vendor/frameworks/bulma.json \
                     docs/demo/vendor/frameworks/uswds.json; do
              echo "| \`$(basename "$f")\` | $(stat -c%s "$f") | $(gzip -9 -c "$f" | wc -c) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Upload the site'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/output

  # Only `master` publishes. A pull request stops after `build`, which is
  # enough to catch a demo that no longer builds.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v5
